[env:quadraro_morena]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	dlloydev/QuickPID@^3.1.9
	adafruit/Adafruit BNO055@^1.6.4
build_flags = 
	-D QUADRARO
	; -D MORENA

